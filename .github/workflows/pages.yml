name: Deploy grocery storefront links to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Validate independent storefront source
        run: |
          set -e
          for site in general-supermarket fresh-produce express-grocery wholesale-bulk; do
            test -s "$site/index.html"
          done
          test -s shared/storefront.js
          test -s shared/storefront.css
          test -s shared/neon-builder-api.js
          node --check shared/storefront.js
          node --check shared/neon-builder-api.js
          ! grep -qi "supabase" shared/neon-builder-api.js
          ! grep -qi "supabase" shared/storefront.js
          ! grep -qi "HALAL_STORE_CONFIG" shared/storefront.js
          for site in general-supermarket fresh-produce express-grocery wholesale-bulk; do
            grep -q "@neon/neon-js" "$site/index.html"
            ! grep -qi "supabase" "$site/index.html"
          done
          echo "All four standalone storefront source entry points passed validation."
      - name: Build origin-isolated redirect-only Pages artifact
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          touch dist/.nojekyll
          cat > dist/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WordPress Studio</title></head><body><main><h1>WordPress Studio</h1><p>The independent WordPress workspace and storefront previews are hosted on their own origin.</p><ul><li><a href="https://wordpress-studio.shipstatic.com/admin/">Open WordPress Admin</a></li><li><a href="https://wordpress-studio.shipstatic.com/general-supermarket/">General Supermarket</a></li><li><a href="https://wordpress-studio.shipstatic.com/fresh-produce/">Fresh Produce</a></li><li><a href="https://wordpress-studio.shipstatic.com/express-grocery/">Express Grocery</a></li><li><a href="https://wordpress-studio.shipstatic.com/wholesale-bulk/">Wholesale &amp; Bulk</a></li></ul></main></body></html>
          EOF
          for site in general-supermarket fresh-produce express-grocery wholesale-bulk; do
            mkdir -p "dist/$site"
            cat > "dist/$site/index.html" <<EOF
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=https://wordpress-studio.shipstatic.com/$site/"><title>Opening storefront</title></head><body><p>Opening the independent storefront… <a href="https://wordpress-studio.shipstatic.com/$site/">Continue</a></p><script>window.location.replace("https://wordpress-studio.shipstatic.com/$site/");</script></body></html>
          EOF
          done
          mkdir -p dist/wordpress-app/admin
          for path in wordpress-app/index.html wordpress-app/admin/index.html; do
            target="dist/$path"
            mkdir -p "$(dirname "$target")"
            cat > "$target" <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=https://wordpress-studio.shipstatic.com/admin/"><title>Opening WordPress Studio</title></head><body><p><a href="https://wordpress-studio.shipstatic.com/admin/">Open the independent WordPress Studio</a></p><script>window.location.replace("https://wordpress-studio.shipstatic.com/admin/");</script></body></html>
          EOF
          done
          test ! -e dist/wordpress-app/admin/neon-client.js
          test ! -e dist/shared/storefront.js
          echo "GitHub Pages contains only redirects and static links; no WordPress runtime, auth or storefront JavaScript is published on the Halal Food GitHub Pages origin."
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
