name: Publish independent WordPress Studio links

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate independent WordPress source
        run: |
          set -e
          for file in wordpress-app/index.html wordpress-app/admin/index.html wordpress-app/admin/neon-client.js wordpress-app/admin/neon-auth.js wordpress-app/admin/neon-builder-api.js wordpress-app/storefront.html wordpress-app/storefront.js wordpress-app/storefront.css; do
            test -s "$file"
          done
          for file in wordpress-app/admin/*.js wordpress-app/scripts/*.mjs wordpress-app/storefront.js; do
            node --check "$file"
          done
          ! grep -RqiE "supabase\\.co|supabase-js|HFAdminReady|HFNeon|HALAL_STORE_CONFIG" wordpress-app/admin wordpress-app/storefront.html wordpress-app/storefront.js
          echo "Standalone WordPress source passed syntax and isolation checks."
      - name: Build isolated launch and template routes
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          touch dist/.nojekyll
          cat > dist/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WordPress Studio</title></head><body><main><h1>WordPress Studio</h1><p>The independent builder and Neon-backed admin run on their own origin.</p><p><a href="https://wordpress-studio.shipstatic.com/admin/">Open WordPress Admin</a></p><p><a href="https://wordpress-studio.shipstatic.com/admin/wordpress-templates.html">Open grocery templates</a></p></main></body></html>
          EOF
          templates="general-supermarket fresh-produce express-grocery wholesale-bulk"
          index=1
          for site in $templates; do
            mkdir -p "dist/$site"
            cat > "dist/$site/index.html" <<EOF
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=https://wordpress-studio.shipstatic.com/admin/wordpress-templates.html?category=ecommerce-grocery&template=$index"><title>Open template preview</title></head><body><p>Opening the independent template library… <a href="https://wordpress-studio.shipstatic.com/admin/wordpress-templates.html?category=ecommerce-grocery&amp;template=$index">Continue</a></p><script>window.location.replace("https://wordpress-studio.shipstatic.com/admin/wordpress-templates.html?category=ecommerce-grocery&template=$index");</script></body></html>
          EOF
            index=$((index+1))
          done
          mkdir -p dist/wordpress-app/admin
          cat > dist/wordpress-app/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=https://wordpress-studio.shipstatic.com/admin/"><title>Opening WordPress Studio</title></head><body><p><a href="https://wordpress-studio.shipstatic.com/admin/">Open WordPress Studio</a></p><script>window.location.replace("https://wordpress-studio.shipstatic.com/admin/");</script></body></html>
          EOF
          cp dist/wordpress-app/index.html dist/wordpress-app/admin/index.html
          cat > dist/storefront.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening storefront</title></head><body><p><a id="continue" href="https://wordpress-studio.shipstatic.com/storefront.html">Open the independent storefront</a></p><script>var target="https://wordpress-studio.shipstatic.com/storefront.html"+location.search+location.hash;document.getElementById("continue").href=target;location.replace(target);</script></body></html>
          EOF
          test ! -e dist/wordpress-app/admin/neon-client.js
          echo "GitHub Pages contains only navigation redirects. WordPress runtime and assets remain on the separate ShipStatic origin."
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
