name: Deploy grocery storefronts to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Validate independent storefront entry points
        run: |
          set -e
          for site in general-supermarket fresh-produce express-grocery wholesale-bulk; do
            test -s "$site/index.html"
          done
          test -s shared/storefront.js
          test -s shared/storefront.css
          test -s shared/neon-builder-api.js
          node --check shared/storefront.js
          node --check shared/neon-builder-api.js
          node .github/scripts/validate-commerce-foundation.mjs
          ! grep -qi "supabase" shared/neon-builder-api.js
          ! grep -qi "supabase" shared/storefront.js
          ! grep -qi "HALAL_STORE_CONFIG" shared/storefront.js
          for site in general-supermarket fresh-produce express-grocery wholesale-bulk; do
            grep -q "@neon/neon-js" "$site/index.html"
            ! grep -qi "supabase" "$site/index.html"
          done
          echo "All four storefront entry points and shared runtime files passed validation."
      - name: Validate WordPress Studio runtime bundle
        run: node .github/scripts/validate-studio-bundle.mjs
      - name: Validate Fitness & Gym templates
        run: node .github/scripts/validate-fitness-gym.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
