name: Deploy grocery storefronts to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate independent storefront entry points
        run: |
          set -e
          for site in general-supermarket fresh-produce express-grocery wholesale-bulk; do
            test -s "$site/index.html"
          done
          test -s shared/storefront.js
          test -s shared/storefront.css
          test -s shared/neon-builder-api.js
          node --check shared/storefront.js
          node --check shared/neon-builder-api.js
          echo "All four storefront entry points and shared runtime files passed validation."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
